name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # For project Pages deployments, Vite assets must be rooted at "/<repo-name>/".
      VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install pnpm first so setup-node can find the cache
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Adjust this if you use a specific major version locally

      # 2. Set up Node.js with pnpm caching enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm # 👈 Changed from 'npm' to 'pnpm'

      # 3. Install dependencies using pnpm
      # Note: --no-frozen-lockfile is omitted to ensure best practices, 
      # and --config.strict-peer-dependencies=false replaces your legacy-peer-deps workaround.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-peer-dependencies=false

      # 4. Build app using pnpm
      - name: Build app
        run: pnpm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4